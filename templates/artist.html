<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fnack — Artist Discography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('fnack_theme') || 'onyx-dark';
      const isLight = savedTheme.includes('light');
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.setAttribute('data-bs-theme', isLight ? 'light' : 'dark');
    })();
  </script>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar navbar-custom sticky-top">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <a class="brand-logo" href="/">
          <i class="fas fa-compact-disc text-danger"></i>
          <span>fnack</span>
        </a>
        <div class="d-none d-md-flex align-items-center gap-1 ms-3">
          <a href="/" class="nav-link-custom"><i class="fas fa-arrow-left me-1"></i>Back to Library</a>
          <a href="/import" class="nav-link-custom"><i class="fas fa-file-import me-1"></i>Import</a>
          <a href="/queue" class="nav-link-custom"><i class="fas fa-tasks me-1"></i>Activity</a>
          <a href="/settings" class="nav-link-custom"><i class="fas fa-cog me-1"></i>Settings</a>
        </div>
      </div>

      <!-- Fast Search Bar -->
      <div class="search-wrapper mx-2 flex-grow-1" style="max-width: 480px;">
        <div class="search-input-group">
          <i class="fas fa-search search-icon"></i>
          <input type="text" class="form-control search-input" id="artistSearch"
                 placeholder="Search artist to add..." autocomplete="off">
          <div class="spinner-border spinner-border-sm text-secondary search-spinner d-none" id="searchSpinner" role="status"></div>
        </div>
        <div class="search-dropdown d-none" id="searchDropdown"></div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <a href="/settings" class="btn btn-outline-secondary btn-sm rounded-circle" style="width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;">
          <i class="fas fa-cog"></i>
        </a>
      </div>
    </div>
  </nav>

  <!-- Artist Content Container -->
  <div id="artistPageContainer">
    <div class="container py-5 text-center text-secondary">
      <div class="spinner-border text-danger" role="status"></div>
      <div class="mt-2">Loading artist discography...</div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index: 2100;"></div>

  <!-- Add Artist Filter Modal (Global) -->
  <div class="modal-overlay d-none" id="addArtistModal">
    <div class="modal-dialog-box">
      <div class="modal-header d-flex align-items-center justify-content-between">
        <h5 class="modal-title m-0 fw-bold" id="addArtistModalTitle">Add Artist</h5>
        <button type="button" class="btn-close btn-close-white" onclick="hideAddArtistModal()"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex align-items-center gap-3 mb-3 p-2 bg-dark rounded">
          <img id="addArtistImg" src="" class="rounded-circle" width="48" height="48" style="object-fit: cover;">
          <div>
            <h6 class="fw-bold m-0" id="addArtistName">Artist</h6>
            <small class="text-secondary">Configure onboarding preferences</small>
          </div>
        </div>

        <h6 class="fw-bold text-secondary text-uppercase small mb-2">Discography Filters</h6>
        <div class="bg-dark p-3 rounded mb-3">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="filterRemixes" checked>
            <label class="form-check-label small" for="filterRemixes">Exclude Remixes, VIPs & Club Edits</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="filterLofi" checked>
            <label class="form-check-label small" for="filterLofi">Exclude Lo-Fi, Acoustic, Slowed & Sped Up versions</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="filterLive" checked>
            <label class="form-check-label small" for="filterLive">Exclude Live Albums & Concert Recordings</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="filterCompilations" checked>
            <label class="form-check-label small" for="filterCompilations">Exclude Compilations & Various Artists</label>
          </div>
        </div>

        <h6 class="fw-bold text-secondary text-uppercase small mb-2">Monitoring & Automation</h6>
        <div class="bg-dark p-3 rounded">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="optMonitored" checked>
            <label class="form-check-label small" for="optMonitored"><strong>Monitor for new releases</strong></label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="optAutoDownload">
            <label class="form-check-label small" for="optAutoDownload"><strong>Download existing discography now</strong></label>
          </div>
        </div>
      </div>
      <div class="modal-footer d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="addArtistCancelBtn">Cancel</button>
        <button type="button" class="btn btn-brand btn-sm" id="addArtistConfirmBtn"><i class="fas fa-plus me-1"></i>Add Artist</button>
      </div>
    </div>
  </div>

  <!-- Generic Confirm Modal -->
  <div class="modal-overlay d-none" id="confirmModal">
    <div class="modal-dialog-box">
      <div class="modal-header">
        <h5 class="modal-title m-0 fw-bold" id="confirmModalTitle">Confirm</h5>
      </div>
      <div class="modal-body" id="confirmModalBody"></div>
      <div class="modal-footer d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" class="btn btn-brand btn-sm" id="confirmModalOkBtn">Confirm</button>
      </div>
    </div>
  <!-- Mobile Bottom Navigation Bar -->
  <div class="mobile-bottom-nav">
    <a href="/" class="mobile-nav-link active"><i class="fas fa-th-large"></i><span>Library</span></a>
    <a href="/import" class="mobile-nav-link"><i class="fas fa-file-import"></i><span>Import</span></a>
    <a href="/queue" class="mobile-nav-link"><i class="fas fa-tasks"></i><span>Activity</span></a>
    <a href="/settings" class="mobile-nav-link"><i class="fas fa-cog"></i><span>Settings</span></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
