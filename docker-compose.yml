services:
  fnack:
    image: ghcr.io/tajanthind/fnack:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fnack
    depends_on:
      - bgutil-provider
    ports:
      - "4688:4688"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ${MUSIC_PATH:-/home/tajanthind/Music}:/music
    environment:
      # Set a fixed SECRET_KEY (e.g. openssl rand -hex 32) so sessions survive restarts.
      - SECRET_KEY=${SECRET_KEY:-}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-1}
      - CHROME_PATH=/usr/bin/chromium
      - DISPLAY=:99
      # PO-token provider: long-lived tokens that help bypass YouTube bot-checks
      # without cookies (used automatically by yt-dlp when the provider is up).
      - POT_PROVIDER_URL=${POT_PROVIDER_URL:-http://bgutil-provider:4416}
    networks:
      - fnack_net
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4688/api/artists || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Proof-of-Origin token provider for yt-dlp (bgutil-ytdlp-pot-provider).
  # Generates long-lived PO tokens so YouTube downloads work without cookies
  # on IPs that would otherwise show "Sign in to confirm you're not a bot".
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    networks:
      - fnack_net

networks:
  fnack_net:
    name: fnack_net
