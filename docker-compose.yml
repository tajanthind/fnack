services:
  fnack:
    image: ghcr.io/tajanthind/fnack:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fnack
    ports:
      - "4688:4688"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ${MUSIC_PATH:-/home/tajanthind/Music}:/music
    environment:
      # Set a fixed SECRET_KEY (e.g. openssl rand -hex 32) so sessions survive restarts.
      - SECRET_KEY=${SECRET_KEY:-}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-1}
      - CHROME_PATH=/usr/bin/chromium
      - DISPLAY=:99
      # PO-token provider runs inside this same container on localhost:4416.
      - POT_PROVIDER_URL=${POT_PROVIDER_URL:-http://127.0.0.1:4416}
    # Optional in-container VPN (configs in ./config/vpn/):
    # OpenVPN (.ovpn) or WireGuard (wg0.conf). Requires these privileges.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4688/api/artists || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  fnack_downloads:
