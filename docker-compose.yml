# fnack — single-container music downloader
# ===========================================
# Run on ANY machine — no git required. Two ways to get the image:
#
#   A) Prebuilt image (needs internet):          docker compose up -d
#      Pulls ghcr.io/tajanthind/fnack:latest (built & published by GitHub
#      Actions from the main branch).
#
#   B) Build locally from this folder:           docker compose up -d --build
#      Use this when you copied the release bundle and have no GHCR access.
#
# First run: copy `.env.example` to `.env` and set MUSIC_PATH to your music
# library (defaults to ./music next to this file). Create ./config and
# ./downloads automatically.
#
# Optional: put an OpenVPN (.ovpn) or WireGuard (wg0.conf) config in
# ./config/vpn/ to route all downloads through a VPN (requires the
# cap_add/devices below — already configured).

services:
  fnack:
    image: ghcr.io/tajanthind/fnack:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fnack
    ports:
      - "4688:4688"
    volumes:
      # Settings / cookies / DB live on the host so they survive rebuilds.
      - ./config:/config
      # In-progress and temp download work files.
      - ./downloads:/downloads
      # Your music library (set MUSIC_PATH in .env).
      - ${MUSIC_PATH:-./music}:/music
    environment:
      # Set a fixed secret (e.g. `openssl rand -hex 32`) so sessions survive
      # restarts. If empty, fnack generates one and stores it in /config.
      - SECRET_KEY=${SECRET_KEY:-}
      # 1 = downloads run one at a time (most reliable against YouTube/zarz.moe
      # rate limits). Raise only if you know your IP is clean.
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-1}
      - CHROME_PATH=/usr/bin/chromium
      - DISPLAY=:99
      # PO-token provider runs inside this same container on localhost:4416.
      - POT_PROVIDER_URL=${POT_PROVIDER_URL:-http://127.0.0.1:4416}
    # Optional in-container VPN (configs in ./config/vpn/):
    # OpenVPN (.ovpn) or WireGuard (wg0.conf). Requires these privileges.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # wg-quick needs this policy-routing mark; Docker applies it at container
    # start (the path is read-only from inside, so the bundled sysctl shim
    # makes wg-quick tolerate that).
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4688/api/artists || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
